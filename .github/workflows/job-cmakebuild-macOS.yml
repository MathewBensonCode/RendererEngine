# CMake build of ZEngine for macOS
#
name: ZEngine macOS Workflow

on:
  workflow_call:
    inputs:
      targetFramework:
        type: string
        required: true
      configuration:
        type: string
        default: 'Debug'
      architecture:
        type: string
        default: 'x64'

env: 
  USERNAME: mathewbensoncode
  VCPKG_EXE: ${{ github.workspace }}/vcpkg/vcpkg
  FEED_URL: https://nuget.pkg.github.com/mathewbensoncode/index.json
  VCPKG_BINARY_SOURCES: "clear;nuget,https://nuget.pkg.github.com/mathewbensoncode/index.json,readwrite"
  VCPKG_ROOT: ${{ github.workspace }}/vcpkg
  CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake

jobs:
  cmake-build:
    name: cmake-build-macOS-${{ inputs.architecture }}-${{ inputs.configuration }}
    runs-on: ${{ inputs.architecture == 'x64' && 'macos-15-intel' || 'macos-latest' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Install NuGet CLI
        run: brew install nuget

      - name: Update LLVM
        run: brew install llvm

      - name: Install vcpkg
        shell: pwsh
        run: git clone https://github.com/Microsoft/vcpkg ${{github.workspace}}/vcpkg

      - name: Bootstrap vcpkg
        shell: pwsh
        run: sh ${{ github.workspace }}/vcpkg/bootstrap-vcpkg.sh

      - name: Add NuGet sources
        shell: pwsh
        run: |
          .$(${{ env.VCPKG_EXE }} fetch nuget) `
          sources add `
          -Source "${{ env.FEED_URL }}" `
          -StorePasswordInClearText `
          -Name GitHubPackages `
          -UserName "${{ env.USERNAME }}" `
          -Password "${{ secrets.GITHUB_TOKEN }}"
          .$(${{ env.VCPKG_EXE }} fetch nuget) `
          setapikey "${{ secrets.GITHUB_TOKEN }}" `
          -Source "${{ env.FEED_URL }}"

      - name: CMake Build
        run: .\Scripts\BuildEngine.ps1 -Configurations ${{inputs.configuration}} -Architecture ${{inputs.architecture}} -RunClangFormat 0
        shell: pwsh

      - name: Publish Build Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Build-macOS-${{ inputs.architecture }}-${{inputs.configuration}}
          if-no-files-found: error
          path: |
            Result.Darwin.${{inputs.architecture}}.${{inputs.configuration}}/bin/
            Result.Darwin.${{inputs.architecture}}.${{inputs.configuration}}/lib/*vulkan*
            Result.Darwin.${{inputs.architecture}}.${{inputs.configuration}}/tests
